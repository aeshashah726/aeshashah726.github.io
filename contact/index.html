<body class="padded flex flex-col items-center pt-[5vmin]">

  <!-- site header island -->

    <div class="nav-island">
      <div class="hidden md:flex items-center pl-1 pr-1">
        <span id="local-time" class="text-xs font-mono tracking-wider text-neutral-400"></span>

      <nav class="flex items-center gap-1">
        <a href="../" class="nav-link">Home</a>
        <a href="../education/" class="nav-link">Education</a>
        <a href="../internships/" class="nav-link">Internships</a>
        <a href="../research/" class="nav-link">Research</a>
        <a href="../projects/" class="nav-link">Projects</a>
        <!-- <a href="../accolades/" class="nav-link">Accolades</a> -->
        <a href="../contact/" class="nav-link active-nav">Contact</a>

  <div id="header-spacer"></div>

  <!-- main content container -->

      <h1

        Contact
      </h1>
    </div>

    <!-- contact cards grid -->
    <div class="w-full max-w-5xl px-4 grid grid-cols-1 md:grid-cols-3 gap-5 mb-16">

      <!-- 1. Email -->
      <div
        class="portfolio-card bg-[#161619] border border-white/[0.08] p-6 rounded-2xl transition-all duration-300 hover:border-white/[0.18] shadow-[0_12px_32px_-10px_rgba(0,0,0,0.5)] flex flex-col justify-between gap-5">
        <div>
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400">
              Email
            </span>
            <svg class="w-4 h-4 text-neutral-400 stroke-current fill-none" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-neutral-900 dark:text-white tracking-tight break-all">
            aeshashah726@gmail.com
          </h2>
        </div>

        <div class="pt-4 border-t border-black/[0.08] dark:border-white/[0.08] flex flex-wrap items-center gap-2">
          <a href="mailto:aeshashah726@gmail.com"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-mono font-medium bg-black/[0.04] dark:bg-white/[0.06] text-neutral-700 dark:text-neutral-300 hover:text-black dark:hover:text-white border border-black/[0.08] dark:border-white/[0.1] hover:border-black/[0.2] dark:hover:border-white/[0.25] transition-all">
            <svg class="w-3.5 h-3.5 stroke-current fill-none shrink-0" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
            <span>Send Email</span>
          </a>
          <button type="button" onclick="copyEmail()"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-mono font-medium bg-black/[0.04] dark:bg-white/[0.06] text-neutral-700 dark:text-neutral-300 hover:text-black dark:hover:text-white border border-black/[0.08] dark:border-white/[0.12] hover:border-black/[0.2] dark:hover:border-white/[0.25] transition-all cursor-pointer">
            <span id="copy-email-text">Copy</span>
          </button>
        </div>
      </div>

      <!-- 2. LinkedIn -->
      <div
        class="portfolio-card bg-[#161619] border border-white/[0.08] p-6 rounded-2xl transition-all duration-300 hover:border-white/[0.18] shadow-[0_12px_32px_-10px_rgba(0,0,0,0.5)] flex flex-col justify-between gap-5">
        <div>
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400">
              LinkedIn
            </span>
            <svg class="w-4 h-4 text-neutral-400 fill-current" viewBox="0 0 24 24">
              <path
                d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
            </svg>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-neutral-900 dark:text-white tracking-tight">
            in/aeshashah7
          </h2>
        </div>

        <div class="pt-4 border-t border-black/[0.08] dark:border-white/[0.08] flex items-center gap-2">
          <a href="https://www.linkedin.com/in/aeshashah7/" target="_blank" rel="noopener"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-mono font-medium bg-black/[0.04] dark:bg-white/[0.06] text-neutral-700 dark:text-neutral-300 hover:text-black dark:hover:text-white border border-black/[0.08] dark:border-white/[0.1] hover:border-black/[0.2] dark:hover:border-white/[0.25] transition-all">
            <svg class="w-3.5 h-3.5 stroke-current fill-none shrink-0" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
            <span>Connect</span>
          </a>
        </div>
      </div>

      <!-- 3. GitHub -->
      <div
        class="portfolio-card bg-[#161619] border border-white/[0.08] p-6 rounded-2xl transition-all duration-300 hover:border-white/[0.18] shadow-[0_12px_32px_-10px_rgba(0,0,0,0.5)] flex flex-col justify-between gap-5">
        <div>
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-mono uppercase tracking-wider text-neutral-500 dark:text-neutral-400">
              GitHub
            </span>
            <svg class="w-4 h-4 text-neutral-400 fill-current" viewBox="0 0 24 24">
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
            </svg>
          </div>
          <h2 class="text-base sm:text-lg font-bold text-neutral-900 dark:text-white tracking-tight">
            @aeshashah726
          </h2>
        </div>

        <div class="pt-4 border-t border-black/[0.08] dark:border-white/[0.08] flex items-center gap-2">
          <a href="https://github.com/aeshashah726" target="_blank" rel="noopener"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-mono font-medium bg-black/[0.04] dark:bg-white/[0.06] text-neutral-700 dark:text-neutral-300 hover:text-black dark:hover:text-white border border-black/[0.08] dark:border-white/[0.1] hover:border-black/[0.2] dark:hover:border-white/[0.25] transition-all">
            <svg class="w-3.5 h-3.5 stroke-current fill-none shrink-0" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
            <span>Profile</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- footer -->
  <div class="w-full max-w-5xl mt-[3em] mb-0 px-4">
    <div
      class="w-full text-center py-6 border-t border-black/[0.08] dark:border-white/[0.08] text-xs font-mono text-neutral-500 dark:text-neutral-400">
      <p>
        Made with 💌 by Aesha Shah
      </p>
      <p class="mt-1">
        code repository on
        <a href="https://github.com/aeshashah726" class="text-blue-600 underline">my Github</a>
      </p>
    </div>
  </div>

  <script>
    function copyEmail() {
      const label = document.getElementById('copy-email-text');
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText('aeshashah726@gmail.com').then(() => {
        if (label) {
          label.textContent = 'Copied!';
          setTimeout(() => {
            label.textContent = 'Copy';
          }, 1600);
        }
      }).catch(() => { });
    }
  </script>
</body>

</html>
