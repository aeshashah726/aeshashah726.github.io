<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Redirecting...</title>
  <link rel="canonical" href="/research/" />
  <script>
    (function () {
      var hash = (window.location.hash || "").toLowerCase();
      var toProjects = hash === "#projects" || hash === "#papers" || hash === "#reports-papers";
      var cleanHash = hash === "#reports-papers" ? "#papers" : (window.location.hash || "");
      var base = toProjects ? "../projects/" : "../research/";
      var target = window.location.protocol === "file:"
        ? base + "index.html" + cleanHash
        : base + cleanHash;
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=../research/" />
</head>

<body style="background:#0b0b0e;color:#a1a1aa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <p style="font-size:13px;">Redirecting to <a href="../research/" style="color:#f4f4f5;">Research</a> or <a href="../projects/" style="color:#f4f4f5;">Projects &amp; Papers</a>...</p>
</body>

</html>
