  <!-- site header island -->
  <header id="site-header">
    <div class="nav-island">
      <div class="hidden md:flex items-center pl-1 pr-1">
        <span id="local-time" class="text-xs font-mono tracking-wider text-neutral-400"></span>

  <div id="header-spacer"></div>

  <!-- main content container -->

      <h1
        class="font-jakarta text-5xl sm:text-6xl lg:text-7xl font-extrabold text-neutral-900 dark:text-white tracking-tight leading-none mb-3">
        Projects
      </h1>
    </div>

    <!-- lock screen -->
    <div id="lock-screen" class="w-full max-w-md px-4 mb-16">
      <div
        class="portfolio-card bg-[#161619] border border-white/[0.08] p-8 sm:p-10 rounded-3xl text-center shadow-[0_20px_40px_-15px_rgba(0,0,0,0.5)]">
        <!-- lock badge -->
        <div
          class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-500 dark:text-amber-400 mb-5 shadow-inner">
          <svg class="w-7 h-7 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <h2 class="text-2xl font-bold tracking-tight text-neutral-900 dark:text-white mb-2">
          Restricted Access
        </h2>
        <p class="text-xs sm:text-sm text-neutral-600 dark:text-neutral-400 leading-relaxed mb-6">
          This page is locked to follow the Georgia Institute of Technology Honor Code.
        </p>

        <!-- unlock form -->
        <form id="unlock-form" onsubmit="handleUnlock(event)" class="space-y-4 text-left">
          <div class="relative">
            <input id="password-input" type="password" required autocomplete="current-password"
              placeholder="Enter password..."
              class="w-full px-4 py-3 rounded-xl bg-black/[0.04] dark:bg-white/[0.05] border border-black/[0.1] dark:border-white/[0.12] text-neutral-900 dark:text-white text-sm font-mono placeholder:text-neutral-400 focus:outline-none focus:border-neutral-500 focus:ring-2 focus:ring-neutral-500/20 transition-all pr-11" />
            <button type="button" onclick="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-neutral-400 hover:text-neutral-200 transition-colors cursor-pointer"
              aria-label="Toggle password visibility">
              <svg id="eye-icon" class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <div id="error-message" class="hidden text-xs font-mono text-rose-500 dark:text-rose-400 text-center">
            Incorrect password. Please try again.
          </div>

          <button id="unlock-button" type="submit"
            class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl text-xs font-mono font-bold tracking-wider uppercase bg-neutral-900 text-white hover:bg-neutral-800 dark:bg-white dark:text-neutral-900 dark:hover:bg-neutral-200 transition-all shadow-md cursor-pointer">
            <svg class="w-4 h-4 stroke-current fill-none" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span id="unlock-btn-text">Unlock</span>
          </button>
        </form>
      </div>
    </div>

    <!-- decrypted projects container -->
    <div id="projects-container" class="w-full flex flex-col items-center hidden"></div>
  </div>

  <!-- footer -->
  <div class="w-full mt-[3em] mb-0">

  <!-- client-side AES-GCM decryption script -->
  <script>
    const SESSION_KEY = 'aeshash_projects_decrypted';

    function togglePasswordVisibility() {
      const input = document.getElementById('password-input');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />';
      }
    }

    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    function base64ToUint8(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptPayload(password) {
      const payloadEl = document.getElementById('encrypted-payload');
      if (!payloadEl) throw new Error('No encrypted payload found.');
      const payload = JSON.parse(payloadEl.textContent);

      if (!payload.salt || !payload.iv || !payload.ciphertext) {
        throw new Error('Payload is incomplete.');
      }

      const salt = base64ToUint8(payload.salt);
      const iv = base64ToUint8(payload.iv);
      const ciphertext = base64ToUint8(payload.ciphertext);

      const key = await deriveKey(password, salt);
      const decryptedBuffer = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        ciphertext
      );
      const dec = new TextDecoder();
      return dec.decode(decryptedBuffer);
    }

    async function handleUnlock(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('password-input');
      const errorEl = document.getElementById('error-message');
      const btn = document.getElementById('unlock-button');
      const btnText = document.getElementById('unlock-btn-text');
      const password = input.value;

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Unlocking...';

      try {
        const html = await decryptPayload(password);
        try {
          const payloadEl = document.getElementById('encrypted-payload');
          const payload = payloadEl ? JSON.parse(payloadEl.textContent) : null;
          sessionStorage.setItem(SESSION_KEY, html);
          if (payload && payload.updatedAt) {
            sessionStorage.setItem(SESSION_KEY + '_updatedAt', payload.updatedAt);
          }
        } catch (err) {}
        renderDecrypted(html);
      } catch (err) {
        errorEl.classList.remove('hidden');
        input.classList.add('ring-2', 'ring-rose-500/50', 'border-rose-500');
        setTimeout(() => {
          input.classList.remove('ring-2', 'ring-rose-500/50', 'border-rose-500');
        }, 1500);
        input.focus();
        input.select();
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Unlock';
      }
    }

    function renderDecrypted(html) {
      const lockScreen = document.getElementById('lock-screen');
      const container = document.getElementById('projects-container');
      container.innerHTML = html;
      container.classList.remove('hidden');
      lockScreen.classList.add('hidden');
    }

    function lockProjects() {
      try {
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY + '_updatedAt');
      } catch (err) {}
      const lockScreen = document.getElementById('lock-screen');
      const container = document.getElementById('projects-container');
      container.innerHTML = '';
      container.classList.add('hidden');
      lockScreen.classList.remove('hidden');
      const input = document.getElementById('password-input');
      if (input) {
        input.value = '';
        input.focus();
      }
    }
    window.lockProjects = lockProjects;

    // Check for cached decrypted content on page load
    (function initSession() {
      try {
        const payloadEl = document.getElementById('encrypted-payload');
        const payload = payloadEl ? JSON.parse(payloadEl.textContent) : null;
        const currentHash = payload ? payload.updatedAt : '';
        const cachedHash = sessionStorage.getItem(SESSION_KEY + '_updatedAt');
        const cached = sessionStorage.getItem(SESSION_KEY);
        if (cached && currentHash && cachedHash === currentHash) {
          renderDecrypted(cached);
        } else {
          sessionStorage.removeItem(SESSION_KEY);
          sessionStorage.removeItem(SESSION_KEY + '_updatedAt');
        }
      } catch (err) {}
    })();
  </script>
