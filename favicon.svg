<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="100%" stop-color="#0e0e11" />
    </linearGradient>
  </defs>
  <style>
    .bg { fill: url(#grad); stroke: rgba(255, 255, 255, 0.2); stroke-width: 2; }
    .txt { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: rgba(0, 0, 0, 0.16); stroke-width: 2; }
      .txt { fill: #111114; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="16" />
  <text class="txt" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">AS</text>
</svg>
